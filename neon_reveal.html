<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000;
  }
  canvas#view {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: block;
    background: #000;
  }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: rgba(255,255,255,0.55); font-size: 13px; letter-spacing: 0.03em;
    pointer-events: none; transition: opacity 0.6s ease; user-select: none;
  }
  #hint.hidden { opacity: 0; }
  #fsBtn {
    position: fixed; top: 14px; right: 14px; z-index: 5;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; letter-spacing: 0.02em;
  }
  #fsBtn:hover { background: rgba(255,255,255,0.16); }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.6); font-size: 14px; letter-spacing: 0.05em; z-index: 10;
  }
</style>

  // ---------------- Seeded RNG (mulberry32), stands in for Python's random(42) ----------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    const rng = mulberry32(seed);
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  // ---------------- Canvas setup ----------------
  const view = document.getElementById("view");
  const vctx = view.getContext("2d", { willReadFrequently: false });

  function sizeToViewport() {
    // "cover" fit: fills the whole screen, cropping the minimum necessary rather than letterboxing.
    const availW = window.innerWidth, availH = window.innerHeight;
    const scale = Math.max(availW / CANVAS_W, availH / CANVAS_H);
    view.style.width = (CANVAS_W * scale) + "px";
    view.style.height = (CANVAS_H * scale) + "px";
  }
  window.addEventListener("resize", sizeToViewport);

  const scratch = document.createElement("canvas");
  const scratchCtx = scratch.getContext("2d");

  const animCanvas = document.createElement("canvas");
  const animCtx = animCanvas.getContext("2d");

  const reflFrame = document.createElement("canvas");
  const reflCtx = reflFrame.getContext("2d");

  function applyCanvasSize() {
    for (const c of [view, baseCanvas, neonCanvas, sharpCanvas, baseReflCanvas, scratch, animCanvas, reflFrame]) {
      c.width = CANVAS_W;
      c.height = CANVAS_H;
    }
  }

  // ---------------- Image loading & fit (mirrors load_and_fit) ----------------
  function loadAndFit(img) {
    // Internal render resolution now matches the image's own aspect ratio, so it fills the
    // canvas edge-to-edge with no black bars baked into the artwork itself.
    const longer = Math.max(img.width, img.height);
    const scale = Math.min(1, MAX_RENDER_DIM / longer);
    CANVAS_W = Math.round(img.width * scale);
    CANVAS_H = Math.round(img.height * scale);
    applyCanvasSize();

    baseCtx.imageSmoothingEnabled = true;
    baseCtx.imageSmoothingQuality = "high";
    baseCtx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
  }

  // ---------------- Edge / neon layer generation (mirrors make_neon_edge_layer) ----------------
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    const d = max - min;
    s = max === 0 ? 0 : d / max;
    if (d === 0) h = 0;
    else {
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h /= 6;
    }
    return [h, s, v];
  }
  function hsvToRgb(h, s, v) {
    let r, g, b;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: r = v; g = t; b = p; break;
      case 1: r = q; g = v; b = p; break;
      case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break;
      case 4: r = t; g = p; b = v; break;
      default: r = v; g = p; b = q;
    }
    return [r * 255, g * 255, b * 255];
  }

  function makeNeonEdgeLayer() {
    const src = baseCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    const w = CANVAS_W, h = CANVAS_H;
    const n = w * h;

    // Grayscale + light box blur (stands in for bilateral filter smoothing)
    const gray = new Float32Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      gray[i] = 0.299 * src.data[p] + 0.587 * src.data[p + 1] + 0.114 * src.data[p + 2];
    }
    const blurred = new Float32Array(n);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let sum = 0, cnt = 0;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = y + dy; if (yy < 0 || yy >= h) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx; if (xx < 0 || xx >= w) continue;
            sum += gray[yy * w + xx]; cnt++;
          }
        }
        blurred[y * w + x] = sum / cnt;
      }
    }

    // Sobel gradient magnitude
    const mag = new Float32Array(n);
    let maxMag = 1;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        const gx =
          -blurred[i - w - 1] + blurred[i - w + 1] +
          -2 * blurred[i - 1] + 2 * blurred[i + 1] +
          -blurred[i + w - 1] + blurred[i + w + 1];
        const gy =
          -blurred[i - w - 1] - 2 * blurred[i - w] - blurred[i - w + 1] +
          blurred[i + w - 1] + 2 * blurred[i + w] + blurred[i + w + 1];
        const m = Math.sqrt(gx * gx + gy * gy);
        mag[i] = m;
        if (m > maxMag) maxMag = m;
      }
    }

    // Threshold using EDGE_LOW/EDGE_HIGH mapped onto the observed gradient range
    const normFactor = 255 / maxMag;
    const highT = EDGE_HIGH, lowT = EDGE_LOW;
    let edgeMask = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const v = mag[i] * normFactor;
      edgeMask[i] = v >= highT ? 1 : (v >= lowT ? 1 : 0);
    }

    // Dilate mask LINE_THICKNESS times (3x3 kernel)
    for (let iter = 0; iter < LINE_THICKNESS; iter++) {
      const next = new Uint8Array(n);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          if (edgeMask[i]) { next[i] = 1; continue; }
          let hit = 0;
          for (let dy = -1; dy <= 1 && !hit; dy++) {
            const yy = y + dy; if (yy < 0 || yy >= h) continue;
            for (let dx = -1; dx <= 1; dx++) {
              const xx = x + dx; if (xx < 0 || xx >= w) continue;
              if (edgeMask[yy * w + xx]) { hit = 1; break; }
            }
          }
          next[i] = hit;
        }
      }
      edgeMask = next;
    }

    // Boosted colour layer at edge pixels only
    const colorLayer = scratchCtx.createImageData(w, h);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      if (!edgeMask[i]) continue;
      const r = src.data[p], g = src.data[p + 1], b = src.data[p + 2];
      const [hh, ss, vv] = rgbToHsv(r, g, b);
      const s2 = Math.min(1, ss * 1.7);
      const v2 = Math.min(1, (vv * 255 * 1.5 + 60) / 255);
      const [rr, gg, bb] = hsvToRgb(hh, s2, v2);
      colorLayer.data[p] = rr; colorLayer.data[p + 1] = gg; colorLayer.data[p + 2] = bb;
      colorLayer.data[p + 3] = 255;
    }
    scratchCtx.putImageData(colorLayer, 0, 0);

    // Multi-pass glow: base + inner blur + outer blur, additive
    neonCtx.clearRect(0, 0, w, h);
    neonCtx.globalCompositeOperation = "source-over";
    neonCtx.globalAlpha = 1;
    neonCtx.filter = "none";
    neonCtx.drawImage(scratch, 0, 0);
    neonCtx.globalAlpha = Math.min(1, 1.1 * GLOW_STRENGTH * 0.5);
    neonCtx.globalCompositeOperation = "lighter";
    neonCtx.filter = "blur(4px)";
    neonCtx.drawImage(scratch, 0, 0);
    neonCtx.globalAlpha = Math.min(1, 0.7 * GLOW_STRENGTH * 0.5);
    neonCtx.filter = "blur(14px)";
    neonCtx.drawImage(scratch, 0, 0);
    neonCtx.filter = "none";
    neonCtx.globalAlpha = 1;
    neonCtx.globalCompositeOperation = "source-over";

    if (AUTO_CONTRAST) {
      const nd = neonCtx.getImageData(0, 0, w, h);
      let ref = 0, count = 0;
      const samples = [];
      for (let p = 0; p < nd.data.length; p += 4) {
        const mx = Math.max(nd.data[p], nd.data[p + 1], nd.data[p + 2]);
        if (mx > 5) samples.push(mx);
      }
      if (samples.length) {
        samples.sort((a, b) => a - b);
        ref = samples[Math.floor(samples.length * 0.99)];
        if (ref > 1) {
          const scale = 255 / ref;
          for (let p = 0; p < nd.data.length; p += 4) {
            nd.data[p] = Math.min(255, nd.data[p] * scale);
            nd.data[p + 1] = Math.min(255, nd.data[p + 1] * scale);
            nd.data[p + 2] = Math.min(255, nd.data[p + 2] * scale);
          }
          neonCtx.putImageData(nd, 0, 0);
        }
      }
    }
  }

  // ---------------- Reflection (mirrors add_reflection) ----------------
  function withReflection(srcCanvas, destCtx) {
    const w = CANVAS_W, h = CANVAS_H;
    destCtx.clearRect(0, 0, w, h);
    destCtx.drawImage(srcCanvas, 0, 0);
    const reflH = Math.floor(h * REFLECTION_HEIGHT_RATIO);
    if (reflH <= 0) return;
    const startY = h - reflH;

    scratchCtx.clearRect(0, 0, w, h);
    scratchCtx.save();
    scratchCtx.translate(0, startY + reflH);
    scratchCtx.scale(1, -1);
    scratchCtx.drawImage(srcCanvas, 0, startY, w, reflH, 0, 0, w, reflH);
    scratchCtx.restore();

    const grad = destCtx.createLinearGradient(0, startY, 0, h);
    grad.addColorStop(0, "rgba(255,255,255,0.35)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    scratchCtx.save();
    scratchCtx.globalCompositeOperation = "destination-in";
    scratchCtx.fillStyle = grad;
    scratchCtx.fillRect(0, startY, w, reflH);
    scratchCtx.restore();

    destCtx.save();
    destCtx.globalCompositeOperation = "lighter";
    destCtx.globalAlpha = 0.55;
    destCtx.drawImage(scratch, 0, startY, w, reflH, 0, startY, w, reflH);
    destCtx.restore();
  }

  // ---------------- Mosaic block grid (mirrors block_mosaic + get_block_grid) ----------------
  let blocks = [];
  function buildBlockGrid() {
    const w = CANVAS_W, h = CANVAS_H, bs = MOSAIC_BLOCK_SIZE;
    const data = neonCtx.getImageData(0, 0, w, h).data;
    const out = [];
    for (let by = 0; by < h; by += bs) {
      const bh = Math.min(bs, h - by);
      for (let bx = 0; bx < w; bx += bs) {
        const bw = Math.min(bs, w - bx);
        // pick the brightest pixel within the block (max channel-sum), like block_mosaic's argmax
        let best = -1, br = 0, bg = 0, bb = 0;
        for (let yy = 0; yy < bh; yy++) {
          for (let xx = 0; xx < bw; xx++) {
            const idx = ((by + yy) * w + (bx + xx)) * 4;
            const sum = data[idx] + data[idx + 1] + data[idx + 2];
            if (sum > best) { best = sum; br = data[idx]; bg = data[idx + 1]; bb = data[idx + 2]; }
          }
        }
        if (Math.max(br, bg, bb) <= DARK_PIXEL_SKIP) continue;
        out.push({ x: bx, y: by, w: bw, h: bh, r: br, g: bg, b: bb });
      }
    }
    return out;
  }

  function drawBlock(ctx, block) {
    const cx = block.x + block.w / 2, cy = block.y + block.h / 2;
    const radius = Math.max(1, Math.min(block.w, block.h) / 2);
    ctx.fillStyle = `rgb(${block.r},${block.g},${block.b})`;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pixelated "block_mosaic" approximation via canvas down/up-scale, used during the refine phase
  const smallCanvas = document.createElement("canvas");
  const smallCtx = smallCanvas.getContext("2d");
  function drawMosaicAtBlockSize(destCtx, blockSize) {
    const w = CANVAS_W, h = CANVAS_H;
    if (blockSize <= 1) {
      destCtx.clearRect(0, 0, w, h);
      destCtx.drawImage(neonCanvas, 0, 0);
      return;
    }
    const sw = Math.max(1, Math.ceil(w / blockSize));
    const sh = Math.max(1, Math.ceil(h / blockSize));
    smallCanvas.width = sw; smallCanvas.height = sh;
    smallCtx.imageSmoothingEnabled = true;
    smallCtx.clearRect(0, 0, sw, sh);
    smallCtx.drawImage(neonCanvas, 0, 0, w, h, 0, 0, sw, sh);
    destCtx.clearRect(0, 0, w, h);
    destCtx.imageSmoothingEnabled = false;
    destCtx.drawImage(smallCanvas, 0, 0, sw, sh, 0, 0, w, h);
    destCtx.imageSmoothingEnabled = true;
  }

  // ---------------- Display prep (mirrors prepare_for_screen) ----------------
  function present(srcCanvas) {
    vctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    vctx.filter = `brightness(${1 + DISPLAY_BRIGHTNESS / 255})`;
    vctx.drawImage(srcCanvas, 0, 0);
    vctx.filter = "none";
  }

  // ---------------- Animation state machine ----------------
  let order = [];
  let running = false;
  let rafId = null;
  let phase = 0;
  let phaseStart = 0;
  let revealedCount = 0;

  const phases = [
    { name: "dots", seconds: DOT_REVEAL_SECONDS },
    { name: "refine", seconds: REFINE_SECONDS },
    { name: "hold", seconds: HOLD_SECONDS },
    { name: "crossfade", seconds: CROSSFADE_SECONDS },
    { name: "final", seconds: FINAL_HOLD_SECONDS },
  ];

  function startAnimation() {
    phase = 0;
    phaseStart = performance.now();
    revealedCount = 0;
    animCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    running = true;
    document.getElementById("hint").classList.remove("hidden");
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function stopAnimation() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function tick(now) {
    if (!running) return;
    const cur = phases[phase];
    let t = (now - phaseStart) / (cur.seconds * 1000);
    if (t > 1) t = 1;

    if (cur.name === "dots") {
      const target = Math.floor(order.length * t);
      for (; revealedCount < target; revealedCount++) {
        drawBlock(animCtx, order[revealedCount]);
      }
      withReflection(animCanvas, reflCtx);
      present(reflFrame);
    } else if (cur.name === "refine") {
      const bs = Math.max(1, Math.round(MOSAIC_BLOCK_SIZE * Math.pow(1 - t, 2)));
      drawMosaicAtBlockSize(animCtx, bs);
      withReflection(animCanvas, reflCtx);
      present(reflFrame);
    } else if (cur.name === "hold") {
      present(sharpCanvas);
    } else if (cur.name === "crossfade") {
      animCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      animCtx.globalAlpha = 1;
      animCtx.drawImage(sharpCanvas, 0, 0);
      animCtx.globalAlpha = t;
      animCtx.drawImage(baseCanvas, 0, 0);
      animCtx.globalAlpha = 1;
      present(animCanvas);
    } else if (cur.name === "final") {
      present(baseCanvas);
    }

    if (t >= 1) {
      if (phase === phases.length - 1) {
        // Sequence complete — freeze on the final plain image, do not loop.
        present(baseCanvas);
        running = false;
        rafId = null;
        document.getElementById("hint").classList.add("hidden");
        return;
      }
      phase++;
      phaseStart = now;
    }
    rafId = requestAnimationFrame(tick);
  }

  // ---------------- Input handling (mirrors q/Esc quit; adds R restart) ----------------
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "q" || k === "escape") {
      stopAnimation();
      document.getElementById("hint").classList.add("hidden");
    } else if (k === "r") {
      startAnimation();
    }
  });

  function enterFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) {
      req.call(el).catch(() => {}); // browsers require a user gesture; ignore silent rejection
    }
  }

  const fsBtn = document.getElementById("fsBtn");
  fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      enterFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  // First tap/click anywhere on the page also triggers fullscreen (satisfies the
  // browser's user-gesture requirement even if the button itself isn't clicked).
  function firstGestureFullscreen() {
    if (!document.fullscreenElement) enterFullscreen();
    window.removeEventListener("click", firstGestureFullscreen);
    window.removeEventListener("keydown", firstGestureFullscreen);
  }
  window.addEventListener("click", firstGestureFullscreen, { once: true });
  window.addEventListener("keydown", firstGestureFullscreen, { once: true });

  document.addEventListener("fullscreenchange", () => {
    fsBtn.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
    sizeToViewport();
  });

  // ---------------- Boot ----------------
  enterFullscreen(); // best-effort; most browsers require the click/keydown gesture above

  const img = new Image();
  img.onload = function () {
    loadAndFit(img);
    makeNeonEdgeLayer();
    withReflection(neonCanvas, sharpCtx);
    withReflection(baseCanvas, baseReflCtx);
    blocks = buildBlockGrid();
    order = seededShuffle(blocks, RANDOM_SEED);

    document.getElementById("loading").style.display = "none";
    sizeToViewport();
    startAnimation();
  };
  img.onerror = function () {
    document.getElementById("loading").textContent = "Could not load image.";
  };
  img.src = IMAGE_DATA_URI;

  sizeToViewport();
})();
</script>
</body>
</html>
